<style>
:root{--gr:#68bd40;--bl:#0c6ba7;--rd:#e8353b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gr:#3f7d2a}}
:root[data-theme="dark"]{--gr:#3f7d2a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--gr);font:15px/1.35 Arial,Helvetica,sans-serif;color:#fff}
#app{max-width:480px;margin:0 auto}
#copy{background:#fff;color:#222;padding-bottom:20px}
#copy img{display:block;width:100%}
.ci{padding:12px 22px 6px;line-height:1.55}.ci .d{text-align:right;margin-bottom:4px}
.box{margin:10px 14px 0;border:6px solid #68bd40;border-radius:26px;padding:12px 18px 18px}
.box h3{margin:0 0 14px;text-align:center;font-size:20px}
.tot{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px}
.tot b{background:#0c6ba7;color:#fff;font-size:22px;padding:8px 20px;border-radius:12px}
.box hr{border:0;border-top:3px solid #68bd40;margin:14px 0 12px}
.bd{font-size:14px}.it{margin:10px 0 14px}.it .r{display:flex;justify-content:space-between;gap:10px}
.it ul{list-style:none;margin:0;padding:0 0 0 20px}
.in{padding:18px 14px 26px}
input,select,textarea{font:inherit;font-size:16px;padding:4px 6px;border:0;border-radius:3px;background:#fff;color:#111}
.btn{border:0;border-radius:10px;font-weight:800;font-size:17px;padding:10px 16px;cursor:pointer;background:var(--bl);color:#fff}
.btn.red{background:var(--rd);color:#fff}.btn.wht{background:#fff;color:var(--bl)}
.row{display:flex;gap:10px;justify-content:center;align-items:center;margin:10px 0;flex-wrap:wrap}
.ttl{font-weight:800;font-size:20px}.ttl input{width:76px;font-weight:800;text-align:center}
#gu{color:var(--bl);font-weight:700}
.lb{font-weight:700;margin:16px 0 6px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cg label{display:block;font-size:13px}.cg input{width:100%;margin-top:2px}.cg .f{grid-column:1/-1}
#sug{position:absolute;left:0;right:0;top:100%;z-index:20;background:#fff;color:#111;border-radius:6px;max-height:230px;overflow:auto;display:none;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.sg{padding:8px 10px;cursor:pointer}.sg small{display:block;color:#555}
#zh{grid-column:1/-1;font-size:12px}
.item{margin:14px 0 18px}.r1{display:flex;align-items:center;gap:8px}.nm{flex:1;min-width:0}
.x{width:26px;height:26px;border:0;background:var(--bl);color:#fff;font-weight:800;border-radius:4px;cursor:pointer}
.pr{color:#111;font-weight:800;min-width:92px;text-align:right}
.r2{display:flex;gap:12px;margin:8px 0 0 34px}
.r2 label,.r3 label{display:flex;align-items:center;gap:6px}.r2 label{flex:1;justify-content:flex-end}.r2 input,.r2 select{width:84px;text-align:right}.r2 select{text-align-last:right}
.li{display:flex;align-items:center;gap:8px;margin:10px 0}.ln{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.btn.sm{font-size:14px;padding:6px 12px}.ed{padding:18px 14px 26px}
.ed input,.ed select,.ed textarea{text-align:left}.ed select{text-align-last:left}
.r3{margin:8px 0 0 34px}.r3 label{align-items:flex-start}.r3 textarea,.r3 input{flex:1;min-width:0}
#msg{text-align:center;min-height:20px;font-size:13px;margin-top:6px}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.mb{background:#fff;color:#222;border-radius:14px;padding:22px;max-width:340px;text-align:center;font-weight:700}

<div class="row" style="margin-top:18px"><button class="btn red" id="e_clr">CLEAR</button><button class="btn wht" id="e_done">DONE</button></div></div></div>
<div class="mod" id="mod" hidden><div class="mb"><p>ALL INFORMATIONS INPUTED WILL BE DELETED</p><div class="row"><button class="btn wht" id="mn">CANCEL</button><button class="btn red" id="my">DELETE</button></div></div></div>
<script>
const $=id=>document.getElementById(id);
const UN={inch:{n:'Inch',f:1,w:'inches'},cm:{n:'CM',f:2.54,w:'cm'},mm:{n:'MM',f:25.4,w:'mm'}};
let G='inch',GR='0.40',items=[],IX=null,loc=null;
const blank=()=>({name:'',unit:null,rate:null,w:'',h:'',qty:'',mat:'100 GSM - Water Proof / Computerized Precision/ Die-cut / Ready to peel.'});
const num=v=>parseFloat(String(v).replace(',','.'))||0,r2=v=>Math.round((v+1e-9)*100)/100,r3=v=>Math.round((v+1e-9)*1000)/1000,fmt=v=>String(num(v));
const money=v=>'P '+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function calc(it){const f=UN[it.unit||G].f,pp=r2(r3((num(it.w)/f)*(num(it.h)/f)*(it.rate==null?num(GR):num(it.rate))));return{pp,tot:r2(pp*num(it.qty))};}
function renderItems(){
  $('items').innerHTML=items.map((it,i)=>{const u=it.unit||G;
  return `<div class="item" data-i="${i}"><div class="r1"><button class="x" data-a="del">X</button><b>${i+1}.</b><input class="nm" data-k="name" value="${esc(it.name)}"><span class="pr"></span></div>
<div class="r2"><label>Unit:<select data-k="unit">${Object.keys(UN).map(k=>`<option value="${k}"${k===u?' selected':''}>${UN[k].n}</option>`).join('')}</select></label><label>Pieces:<input data-k="qty" inputmode="numeric" value="${esc(it.qty)}"></label></div>
<div class="r2"><label>Width:<input data-k="w" inputmode="decimal" value="${esc(it.w)}"></label><label>Height:<input data-k="h" inputmode="decimal" value="${esc(it.h)}"></label></div>
<div class="r3"><label>Material:<textarea data-k="mat" rows="2">${esc(it.mat)}</textarea></label></div>
</div>`;}).join('');
}
function update(){
  let total=0,html='',n=0;
  const date=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  document.querySelectorAll('#items .item').forEach((el,i)=>{el.querySelector('.pr').textContent=money(calc(items[i]).tot);});
  items.forEach(it=>{const c=calc(it);total+=c.tot;if(!it.name&&!c.tot)return;n++;const u=UN[it.unit||G],L=[];
    if(num(it.w)||num(it.h))L.push(`${fmt(it.w)} ${u.w} width x ${fmt(it.h)} ${u.w} height`);
    if(num(it.qty))L.push(`${num(it.qty).toLocaleString('en-US')} ${num(it.qty)===1?'piece':'pieces'}`);
    if(c.pp)L.push(`P${c.pp.toFixed(2)} pesos per piece`);
    if(it.mat.trim())L.push(it.mat.trim());
    html+=`<div class="it"><div class="r"><span>${n}. ${esc(it.name.toUpperCase())}</span><b>${money(c.tot)}</b></div><ul>${L.map(x=>`<li>- ${esc(x)}</li>`).join('')}</ul></div>`;});
  $('bd').innerHTML=html;$('tot').textContent=money(total);
  const ad=[$('st').value.trim(),loc&&loc.city,loc&&[loc.prov,loc.zip].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  $('ci').innerHTML=`<div class="d">${date}</div>`+[['Client',$('cl').value],['Address',ad],['Contact Person',$('cp').value],['Contact No.',$('ctc').value],['Barangay',$('brgy').value]].filter(r=>r[1].trim()).map(r=>`<div>${r[0]}: ${esc(r[1].trim().toUpperCase())}</div>`).join('');
  const ov=items.some(it=>it.unit&&it.unit!==G);$('allb').className='btn '+(ov?'wht':'red');$('gu').value=ov?'':G;const rv=items.some(it=>it.rate!=null);$('allr').className='btn '+(rv?'wht':'red');if(document.activeElement!==$('rate'))$('rate').value=rv?'VARIED':f2(GR);
}
function setAll(){items.forEach(it=>it.unit=null);renderItems();update();}
$('gu').onchange=()=>{G=$('gu').value;setAll();};
$('allb').onclick=setAll;
$('rate').oninput=()=>{const v=$('rate').value;if(!isNaN(parseFloat(v)))GR=v;update();};$('cinfo').addEventListener('input',ev=>{if(['cl','st','cp','brgy'].includes(ev.target.id))capEl(ev.target);update();});
$('add').onclick=()=>{items.push(blank());renderItems();update();openEdit(items.length-1);};
$('items').addEventListener('input',ev=>{const el=ev.target,k=el.dataset.k;if(!k)return;const i=+el.closest('.item').dataset.i;
  if(k==='unit')items[i].unit=el.value===G?null:el.value;else items[i][k]=el.value;update();});
$('items').addEventListener('click',ev=>{if(ev.target.dataset.a!=='del')return;const i=+ev.target.closest('.item').dataset.i;
  items.splice(i,1);renderItems();update();});
let pend=null;const ask=fn=>{pend=fn;$('mod').hidden=false;};$('clr').onclick=()=>ask(clearAll);$('mn').onclick=()=>{$('mod').hidden=true;pend=null;};
const clearAll=()=>{['cl','st','cp','ctc','brgy'].forEach(k=>$(k).value='');loc=null;$('zh').textContent='';items=[];renderItems();update();msg('Cleared.');};$('my').onclick=()=>{$('mod').hidden=true;const f=pend;pend=null;if(f)f();};
function msg(t){$('msg').textContent=t;}
async function save(name,data){try{if(!(window.claude&&claude.use)){const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=name;document.body.appendChild(a);a.click();a.remove();msg('Saved '+name);return;}
  const d=await claude.use('downloads');if(!d){msg('Saving files is not available in this view.');return;}
  await d.save({filename:name,data});msg('Saved '+name);}catch(e){msg(e&&e.code==='declined'?'Save cancelled.':'Could not save: '+((e&&e.message)||e));}}
const fname=ext=>'Quotation-'+(($('cl').value.trim()||'client').replace(/[^\w-]+/g,'-'))+'.'+ext;
async function shot(){if(!window.html2canvas)throw new Error('Image tool did not load. Check your connection.');
  const c=$('copy').cloneNode(true);Object.assign(c.style,{position:'fixed',left:'-10000px',top:'0',width:'480px'});
  document.body.appendChild(c);try{return await html2canvas(c,{scale:2,backgroundColor:'#ffffff'});}finally{c.remove();}}
$('sj').onclick=async()=>{try{msg('Preparing image...');const cv=await shot();const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.95));await save(fname('jpg'),b);}catch(e){msg(e.message);}};
$('sp').onclick=async()=>{try{msg('Preparing PDF...');const cv=await shot();if(!window.jspdf)throw new Error('PDF tool did not load. Check your connection.');
  const W=360,H=W*cv.height/cv.width,p=new jspdf.jsPDF({unit:'pt',format:[W,H],orientation:H>W?'p':'l'});
  p.addImage(cv.toDataURL('image/jpeg',0.95),'JPEG',0,0,W,H);await save(fname('pdf'),p.output('blob'));}catch(e){msg(e.message);}};
$('sx').onclick=()=>{if(!window.XLSX){msg('Excel tool did not load. Check your connection.');return;}
  const info=[['Field','Value'],['Client',$('cl').value],['Address',$('st').value],['Contact person',$('cp').value],['Contact',$('ctc').value],['Barangay',$('brgy').value],['City',loc?loc.city:''],['Province',loc?loc.prov:''],['ZIP',loc?loc.zip:''],['Cost per sq. inch',num(GR)],['All units',G]];
  const rows=[['Item','Unit','Width','Height','Pieces','Material','Cost per piece','Total','Cost per sq. inch']];
  items.forEach(it=>{const c=calc(it);rows.push([it.name,UN[it.unit||G].n,num(it.w),num(it.h),num(it.qty),it.mat,c.pp,c.tot,it.rate==null?num(GR):num(it.rate)]);});
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(info),'Info');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Items');
  save(fname('xlsx'),XLSX.write(wb,{bookType:'xlsx',type:'array'}));};
$('lx').onclick=()=>{if(!window.XLSX){msg('Excel tool did not load. Check your connection.');return;}$('fx').click();};
$('fx').onchange=async()=>{const f=$('fx').files[0];if(!f)return;try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  const inf={};XLSX.utils.sheet_to_json(wb.Sheets.Info,{header:1}).slice(1).forEach(r=>inf[r[0]]=r[1]??'');
  const m={Client:'cl',Address:'st','Contact person':'cp',Contact:'ctc',Barangay:'brgy'};
  Object.keys(m).forEach(k=>$(m[k]).value=inf[k]??'');loc=inf.City?{city:String(inf.City),prov:String(inf.Province||''),zip:String(inf.ZIP||'')}:null;$('zh').textContent=loc?[loc.city,loc.prov,loc.zip].filter(Boolean).join(', '):'';
  GR=f2(inf['Cost per sq. inch']||0.4);G=String(inf['All units']||'inch').toLowerCase();if(!UN[G])G='inch';$('gu').value=G;
  items=XLSX.utils.sheet_to_json(wb.Sheets.Items,{header:1}).slice(1).filter(r=>r.length).map(r=>{const u=String(r[1]||'').toLowerCase();
    return{name:String(r[0]??''),unit:UN[u]&&u!==G?u:null,w:r[2]||'',h:r[3]||'',qty:r[4]||'',mat:String(r[5]??''),rate:(r[8]!=null&&r[8]!==''&&Math.abs(num(r[8])-num(GR))>1e-9)?String(r[8]):null};});
  if(!items.length)items=[blank()];renderItems();update();msg('Loaded '+f.name);}catch(e){msg('Could not read that Excel file.');}$('fx').value='';};
function ix(){if(IX)return IX;const D=JSON.parse($('d').textContent);IX=[];
  D.b.forEach((g,i)=>{const mu=D.m[i];g.split('|').forEach(nm=>IX.push([nm,mu,(nm+' '+mu[0]+' '+mu[1]).toLowerCase()]));});return IX;}
function sug(){const v=$('brgy').value.toLowerCase().split(/[\s,]+/).filter(Boolean),box=$('sug');
  if(v.join('').length<2){box.style.display='none';return;}
  const r=[];for(const e of ix()){if(v.every(t=>e[2].includes(t))){r.push([e[0].toLowerCase().startsWith(v[0])?0:1,e]);if(r.length>400)break;}}
  r.sort((a,b)=>a[0]-b[0]);box.innerHTML='';
  r.slice(0,8).forEach(([,e])=>{const d=document.createElement('div');d.className='sg';d.textContent=e[0];const s=document.createElement('small');
    s.textContent=e[1][0]+(e[1][1]?', '+e[1][1]:'')+(e[1][3]?' '+e[1][3].split('/')[0]:'');d.appendChild(s);
    d.addEventListener('mousedown',ev=>{ev.preventDefault();pick(e);});box.appendChild(d);});
  box.style.display=r.length?'block':'none';}
function pick(e){const mu=e[1],z=mu[3].split('/');$('brgy').value=e[0];loc={city:mu[0],prov:mu[1],zip:z[0]||''};
  $('zh').textContent=[mu[0],mu[1],z[0]].filter(Boolean).join(', ')+(z.length>1?' (other ZIP codes: '+z.slice(1).join(', ')+')':'');$('sug').style.display='none';update();}
$('brgy').addEventListener('input',()=>{loc=null;$('zh').textContent='';sug();});$('brgy').addEventListener('blur',()=>setTimeout(()=>{$('sug').style.display='none'},150));
function fit(el){const ta=el.tagName==='TEXTAREA',over=()=>ta?el.scrollHeight>el.clientHeight+1:el.scrollWidth>el.clientWidth;let s=16;el.style.fontSize=s+'px';while(over()&&s>9){s-=0.5;el.style.fontSize=s+'px';}}
function fitAll(){['e_name','e_mat'].forEach(id=>fit($(id)));}
renderItems=function(){$('items').innerHTML=items.map((it,i)=>`<div class="item li" data-i="${i}"><button class="x" data-a="del">X</button><span class="ln">${i+1}. ${esc(it.name||'(no name)')}</span><span class="pr">${money(calc(it).tot)}</span><button class="btn sm" data-a="edit">EDIT</button></div>`).join('');};
let cur=-1;const MAIN=()=>document.querySelector('.in');
function openEdit(i){cur=i;const it=items[i];$('et').textContent='ITEM '+(i+1);$('e_name').value=it.name;$('e_unit').value=it.unit||G;$('e_qty').value=it.qty;$('e_w').value=it.w;$('e_h').value=it.h;$('e_mat').value=it.mat;$('e_rate').value=f2(it.rate==null?GR:it.rate);$('copy').hidden=true;MAIN().hidden=true;$('edit').hidden=false;scrollTo(0,0);fitAll();}
function closeEdit(){cur=-1;$('edit').hidden=true;$('copy').hidden=false;MAIN().hidden=false;renderItems();update();scrollTo(0,0);}
const eh=ev=>{if(cur<0)return;if(ev.target.id==='e_name')capEl(ev.target);const m={e_name:'name',e_qty:'qty',e_w:'w',e_h:'h',e_mat:'mat'},id=ev.target.id,it=items[cur];if(id==='e_unit')it.unit=ev.target.value===G?null:ev.target.value;else if(id==='e_rate'){const v=ev.target.value.trim();it.rate=(v===''||Math.abs(num(v)-num(GR))<1e-9)?null:v;if(ev.type==='change')ev.target.value=f2(it.rate==null?GR:it.rate);}else if(m[id])it[m[id]]=ev.target.value;if(id==='e_name'||id==='e_mat')fit(ev.target);update();};
$('edit').addEventListener('input',eh);$('edit').addEventListener('change',eh);
$('e_done').onclick=closeEdit;
$('e_clr').onclick=()=>ask(()=>{if(cur<0)return;Object.assign(items[cur],blank());openEdit(cur);update();});
$('items').addEventListener('click',ev=>{if(ev.target.dataset.a==='edit')openEdit(+ev.target.closest('.item').dataset.i);});
function f2(v){return num(v).toFixed(2);}
function cap(s){return s.toLowerCase().replace(/(^|[\s(\/-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());}
function capEl(el){const s=el.value,c=cap(s);if(s!==c){const p=el.selectionStart,e=el.selectionEnd;el.value=c;try{el.setSelectionRange(p,e);}catch(_){}}}
$('allr').onclick=()=>{items.forEach(it=>it.rate=null);renderItems();update();};
$('rate').addEventListener('change',()=>{const v=$('rate').value.trim();if(v===''||isNaN(parseFloat(v)))return;GR=f2(v);items.forEach(it=>it.rate=null);renderItems();update();});
$('rate').addEventListener('focus',()=>{if($('rate').value==='VARIED')$('rate').value='';});
$('rate').addEventListener('blur',()=>setTimeout(update,0));
$('rate').addEventListener('keydown',ev=>{if(ev.key==='Enter')$('rate').blur();});
$('items').addEventListener('input',ev=>{const k=ev.target.dataset.k;if(k==='name'||k==='mat')fit(ev.target);});
addEventListener('resize',fitAll);
items=[];renderItems();update();
</script>
